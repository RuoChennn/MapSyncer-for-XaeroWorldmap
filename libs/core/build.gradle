plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations {
    packagerLogging {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation(project(':libs:lz4-relocated')) {
        transitive = false
    }
    packagerLogging 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

def packagerMainClass = 'com.mapsyncer.tool.MapPackager'

tasks.register('mapPackagerJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ''
    archiveBaseName = 'mapsyncer-packager'
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('dist')

    manifest {
        attributes 'Main-Class': packagerMainClass
    }

    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath, project.configurations.packagerLogging]
    configureLz4ShadowExcludes(it)

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('mapPackagerDist', Zip) {
    dependsOn mapPackagerJar

    archiveFileName = "mapsyncer-packager-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(mapPackagerJar.archiveFile) {
        into '.'
    }
    from('scripts') {
        into '.'
    }

    doLast {
        logger.lifecycle("MapPackager 发布包: ${archiveFile.get().asFile.absolutePath}")
    }
}
