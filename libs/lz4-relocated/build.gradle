plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

configurations {
    lz4Shadow {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    lz4Shadow 'org.lz4:lz4-java:1.8.0'
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

tasks.named('shadowJar') {
    archiveClassifier.set('')
    archiveBaseName.set('lz4-relocated')
    configurations = [project.configurations.lz4Shadow]
    configureLz4Shadow(it)
    configureLz4ShadowExcludes(it)

    outputs.upToDateWhen {
        def jarFile = archiveFile.get().asFile
        jarFile.exists() && jarFile.length() >= 1024
    }

    doLast {
        def jarFile = archiveFile.get().asFile
        if (jarFile.length() < 1024) {
            throw new GradleException(
                "lz4-relocated shadowJar is unexpectedly small (${jarFile.length()} bytes). " +
                "Run ':libs:lz4-relocated:clean :libs:lz4-relocated:shadowJar' and rebuild."
            )
        }
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

afterEvaluate {
    [configurations.apiElements, configurations.runtimeElements].each { elements ->
        elements.outgoing.artifacts.clear()
        elements.outgoing.artifact(tasks.named('shadowJar'))
    }
}
