plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version + '-forge-1.20.1'
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 需要 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    // ForgeGradle 6.0+ mappings 配置
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 引用 shared/common 源码目录（全版本共享的 MC API 代码）
sourceSets.main.java.srcDir '../../../shared/common/src/main/java'
// 引用 shared/mc-1.20 源码目录（1.20.x 版本共享代码）
sourceSets.main.java.srcDir '../../../shared/mc-1.20/src/main/java'

dependencies {
    // Minecraft Forge 1.20.1
    minecraft "net.minecraftforge:forge:${minecraft_1201_version}-${forge_1201_version}"

    // 强制 jopt-simple 版本（Mojang 使用的版本）
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('forge120MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}