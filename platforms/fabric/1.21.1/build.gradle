plugins {
    id 'fabric-loom' version '1.9.2'
}

version = mod_version + '-fabric-1.21.1'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 1.21.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
    // Mod Menu (optional)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// 公共代码：引用 shared/common 和 shared/mc-1.21 中的服务端和工具代码（排除客户端代码）
sourceSets.main {
    java {
        srcDir '../../../shared/common/src/main/java'
        srcDir '../../../shared/mc-1.21/src/main/java'
        srcDir 'src/main/java'
        // 排除客户端代码目录
        exclude 'com/mapsyncer/client/**'
    }
    resources {
        srcDir '../../../shared/common/src/main/resources'
        srcDir 'src/main/resources'
    }
}

// 分离客户端和公共代码，防止客户端代码在服务端意外调用
loom {
    splitEnvironmentSourceSets()

    mods {
        "mapsyncer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// 客户端代码：引用 shared/common 和 shared/mc-1.21 中的客户端代码
sourceSets.client {
    java {
        srcDir '../../../shared/common/src/main/java'
        srcDir '../../../shared/mc-1.21/src/main/java'
        srcDir 'src/client/java'
        // 只包含客户端代码
        include 'com/mapsyncer/client/**'
    }
    resources {
        srcDir '../../../shared/common/src/main/resources'
        srcDir 'src/client/resources'
    }
}

dependencies {
    // Minecraft and Fabric 1.21.1
    minecraft "com.mojang:minecraft:1.21.1"
    // 使用 official mappings (Mojmap) 以保持与其他平台一致
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.2"

    // Fabric API for 1.21.1 (includes networking-api-v1 transitively)
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.12+1.21.1"

    // Cloth Config (for configuration)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.127"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    // include 会将依赖打包到 JAR 中
    include project(':libs:core')
    include project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "1.21.1"
    inputs.property "loader_version", "0.19.2"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "1.21.1",
                "loader_version": "0.19.2"
    }
}

publishing {
    publications {
        register('fabric121MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}