plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
}

version = mod_version + '-fabric-26.1'
group = mod_group_id

base {
    archivesName = mod_id + '-fabric-26.1'
}

// Fabric 26.1 需要 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    splitEnvironmentSourceSets()

    mods {
        "mapsyncer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.19.2"
    implementation "net.fabricmc.fabric-api:fabric-api:0.149.1+26.1.2"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:26.1.154"

    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "1.21.4"
    inputs.property "loader_version", "0.16.0"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "1.21.4",
                "loader_version": "0.16.0"
    }
}

publishing {
    publications {
        register('fabric26MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}