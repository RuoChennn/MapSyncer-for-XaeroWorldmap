plugins {
    id 'net.neoforged.gradle' version '6.0.21'
}

version = mod_version + '-neoforge-1.20.4'
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.20.4 需要 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    mappings channel: 'official', version: '1.20.4'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'neoforge.logging.markers', 'REGISTRIES'
            property 'neoforge.logging.console.level', 'debug'
        }

        client {
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'neoforge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 引用 minecraft-common 源码目录（全版本共享的 MC API 代码）
sourceSets.main.java.srcDir '../../../shared/common/src/main/java'

dependencies {
    // NeoForge 20.4.x for Minecraft 1.20.4
    minecraft "net.neoforged:neoforge:20.4.234"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('neoforge204MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}