plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version + '-neoforge-1.21.1'
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge 1.21.1 子项目（NeoForge 21.1.x）
// 依赖 core 和 platform-api 模块

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    // NeoForge 21.1.x for Minecraft 1.21.1
    version = "21.1.77"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemapping', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// 引用 shared/common 源码目录（全版本共享的 MC API 代码）
// shared/common 不独立编译，由平台模块提供 Minecraft 依赖
sourceSets.main.java.srcDir '../../../shared/common/src/main/java'
// 引用 shared/mc-1.21 源码目录（1.21.x 版本共享代码）
sourceSets.main.java.srcDir '../../../shared/mc-1.21/src/main/java'

dependencies {
    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}