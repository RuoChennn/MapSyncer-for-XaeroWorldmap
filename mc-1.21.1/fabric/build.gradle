plugins {
    id 'fabric-loom' version '1.9.2'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-fabric-' + g2_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 1.21.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDirs(
    "${rootProject.projectDir}/libs/mc-1.21/src/main/java",
    "${rootProject.projectDir}/libs/common/src/main/java",
    'src/main/java',
)
sourceSets.main.resources.srcDirs(
    "${rootProject.projectDir}/libs/mc-1.21/src/main/resources",
    "${rootProject.projectDir}/libs/common/src/main/resources",
    'src/main/resources',
)

apply from: rootProject.file('gradle/fabric-lz4-shadow.gradle')
apply from: rootProject.file('gradle/fabric-modmenu-stub.gradle')

dependencies {
    // Minecraft and Fabric 1.21.1
    minecraft "com.mojang:minecraft:1.21.1"
    // 使用 official mappings (Mojmap) 以保持与其他平台一致
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.2"

    // Fabric API for 1.21.1 (includes networking-api-v1 transitively)
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.12+1.21.1"

    // Cloth Config (for configuration)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.127"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    shadowBundle project(':libs:core')
    shadowBundle project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_range_fabric", g2_minecraft_range_fabric
    inputs.property "loader_version", "0.19.2"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_range_fabric": g2_minecraft_range_fabric,
                "loader_version": "0.19.2"
    }
}

publishing {
    publications {
        register('fabric121MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}