plugins {
    id 'java-library'
}

group = mod_group_id
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Platform API 模块：平台抽象接口定义
// 定义 Forge/NeoForge/Fabric 的统一抽象层
// 不包含具体实现，仅定义接口

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')

    // Minecraft 核心类型（仅用于接口定义的类型引用）
    // 这些类型在不同平台有相同名称，可以安全引用
    // 注意：不在此模块中使用平台特定 API
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}