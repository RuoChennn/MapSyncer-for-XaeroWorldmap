# Gradle properties
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# Enable Gradle toolchain auto-download (may fail due to network)
org.gradle.java.installations.auto-download=true

# Java 25 path - for MC 26.1 (main JDK)
# org.gradle.java.home= (disabled for Linux)

# Java 17 path - for Forge 1.20.x toolchain
# org.gradle.java.installations.paths= (disabled for Linux)

# Mod properties
mod_id=mapsyncer
mod_name=MapSyncer
mod_version=1.0.4
mod_group_id=com.mapsyncer
mod_authors=Ruo_Chen
mod_description=Syncs server-side explored areas to client's Xaero World Map

# Minecraft and NeoForge versions (NeoForge 1.21)
minecraft_version=1.21.1
neo_version=21.1.77
neo_version_range=[21.0,)
minecraft_version_range=[1.21,1.22)

# Forge 1.20.1 versions
forge_1201_version=47.3.0
forge_1201_version_range=[47,48)
minecraft_1201_version=1.20.1
minecraft_1201_version_range=[1.20.1,1.20.2)

# Forge 1.20.4 versions
forge_1204_version=49.0.26
forge_1204_version_range=[49,50)
minecraft_1204_version=1.20.4
minecraft_1204_version_range=[1.20.4,1.20.5)

# Forge 1.21.1 versions (most popular)
forge_1211_version=52.0.0
forge_1211_version_range=[52,53)
minecraft_1211_version=1.21.1
minecraft_1211_version_range=[1.21.1,1.21.2)

# Xaero's World Map version
xaero_worldmap_version=1.40.11

# NeoForge 26.1 versions (Minecraft 26.1)
neo_261_version=26.1.0.19-beta
neo_261_version_range=[26.1,)

# G4 26.1 glue (protocol 775)
g4_261_jar_suffix=26.1
g4_261_minecraft_range_forge=[26.1,26.2)
g4_261_minecraft_range_fabric=>=26.1 <26.2
minecraft_261_version=26.1.2
fabric_api_261_version=0.149.1+26.1.2
cloth_config_261_version=26.1.154

# G4 26.2 glue (protocol 776)
neo_262_version=26.2.0.7-beta
neo_262_version_range=[26.2,)
g4_262_jar_suffix=26.2
g4_262_minecraft_range_forge=[26.2,27)
g4_262_minecraft_range_fabric=>=26.2 <27
minecraft_262_version=26.2
fabric_api_262_version=0.154.0+26.2
cloth_config_262_version=26.2.155
fml_loader_262_version=11.0.14

# Legacy G4 aliases (26.1 glue still references these in some docs)
g4_jar_suffix=26.1
g4_minecraft_range_forge=[26.1,26.2)
g4_minecraft_range_fabric=>=26.1 <26.2
g1_minecraft_range_forge=[1.20,1.20.2)
g1_minecraft_range_fabric=>=1.20 <1.20.2

g2_jar_suffix=1.21
g2_minecraft_range_forge=[1.21,1.22)
g2_minecraft_range_fabric=>=1.21 <1.22

g3_jar_suffix=1.21.11
g3_minecraft_range_forge=[1.21.11,1.21.12)
g3_minecraft_range_fabric=>=1.21.11 <1.21.12

# Anchor group JAR suffix + mod metadata MC ranges (one JAR per G group)
g1_jar_suffix=1.20
