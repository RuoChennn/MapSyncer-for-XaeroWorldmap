plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version + '-neoforge-26.1'
group = mod_group_id

base {
    archivesName = mod_id + '-neoforge-26.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge 26.1.x 子项目
// 支持 Minecraft 26.1, 26.1.1, 26.1.2 等版本

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    // NeoForge 26.1.x for Minecraft 26.1
    version = "26.1.77"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

// 引用 minecraft-common 源码目录（全版本共享的 MC API 代码）
sourceSets.main.java.srcDir '../../minecraft-common/src/main/java'

dependencies {
    implementation project(':core')
    implementation project(':platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}