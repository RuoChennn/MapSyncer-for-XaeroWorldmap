plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
}

version = mod_version + '-fabric-1.21.11'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 1.21.11 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    splitEnvironmentSourceSets()

    mods {
        "mapsyncer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:intermediary:1.21.11:v2"
    implementation "net.fabricmc:fabric-loader:0.19.2"
    implementation "net.fabricmc.fabric-api:fabric-api:0.149.1+1.21.11"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:21.11.153"

    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "1.21.11"
    inputs.property "loader_version", "0.19.2"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "1.21.11",
                "loader_version": "0.19.2"
    }
}

publishing {
    publications {
        register('fabric2111MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}