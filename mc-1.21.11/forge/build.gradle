plugins {
    id 'net.minecraftforge.gradle' version '[6.0.46,7)'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-forge-' + g3_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.21.11 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    // Mappings 配置（ForgeGradle 6.0+）- 1.21.11
    mappings channel: 'official', version: '1.21.11'

    // 使用 Official mappings 时必须设置 reobf = false
    reobf = false

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 引用版本特定的共享源码（由平台模块提供 MC 依赖）
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/mc-1.21.11/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/mc-1.21.11/src/main/resources"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // Minecraft Forge 1.21.11 (Forge 61.x)
    minecraft "net.minecraftforge:forge:1.21.11-61.0.0"

    // 强制 jopt-simple 版本（Mojang 使用的版本）
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range_forge", g3_minecraft_range_forge

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_range_forge": g3_minecraft_range_forge
    }
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

// 创建仅包含项目内部依赖的配置
configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    configureLz4ShadowExcludes(it)
}

// 重新配置 jar 任务依赖 shadowJar
tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

// 禁用 jarJar（使用 shadowJar 替代）
tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        register('forge12111MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}