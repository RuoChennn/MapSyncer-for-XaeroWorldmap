plugins {
    id 'net.minecraftforge.gradle' version '[6.0.46,7)'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-forge-1.21.11'
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.21.11 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    // Mappings 配置（ForgeGradle 6.0+）- 1.21.11
    mappings channel: 'official', version: '1.21.11'

    // 使用 Official mappings 时必须设置 reobf = false
    reobf = false

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 引用版本特定的共享源码（由平台模块提供 MC 依赖）
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // Minecraft Forge 1.21.11 (Forge 61.x)
    minecraft "net.minecraftforge:forge:1.21.11-61.0.0"

    // 强制 jopt-simple 版本（Mojang 使用的版本）
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // 依赖核心模块（排除 LZ4 — MC 1.21.11+ 内置 at.yawk.lz4）
    implementation(project(':libs:core')) {
        exclude group: 'org.lz4', module: 'lz4-java'
    }
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 创建仅包含项目内部依赖的配置
configurations {
    bundle
}
dependencies {
    bundle(project(':libs:core')) {
        exclude group: 'org.lz4', module: 'lz4-java'
    }
    bundle project(':libs:platform-api')
}

// Shadow 插件配置：仅打包项目内部依赖
shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    // 排除 slf4j（运行时已由模块系统提供）
    exclude 'org/slf4j/**'
    // 排除 META-INF 中的签名文件
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// 重新配置 jar 任务依赖 shadowJar
tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

// 禁用 jarJar（使用 shadowJar 替代）
tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        register('forge12111MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}