plugins {
    id 'net.minecraftforge.gradle' version '[6.0.46,7)'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-forge-1.21.11'
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.21.11 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    // Mappings 配置（ForgeGradle 6.0+）- 1.21.11
    mappings channel: 'official', version: '1.21.11'

    // 使用 Official mappings 时必须设置 reobf = false
    reobf = false

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 引用版本特定的共享源码（由平台模块提供 MC 依赖）
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"
sourceSets.main.resources.srcDir "${buildDir}/generated/resources/mixin"

dependencies {
    // Minecraft Forge 1.21.11 (Forge 61.x)
    minecraft "net.minecraftforge:forge:1.21.11-61.0.0"

    // Mixin annotation processor and compile-time dependency
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "org.spongepowered:mixin:0.8.5"

    // 强制 jopt-simple 版本（Mojang 使用的版本）
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.register('createMixinMcpToSrg') {
    dependsOn 'createMcpToSrg'
    def tsrgFile = file("${buildDir}/createMcpToSrg/output.tsrg")
    def srgFile = file("${buildDir}/createMcpToSrg/output.srg")
    inputs.file(tsrgFile)
    outputs.file(srgFile)
    doLast {
        String fromClass = null
        String toClass = null
        srgFile.parentFile.mkdirs()
        srgFile.withWriter('UTF-8') { writer ->
            tsrgFile.eachLine('UTF-8') { line ->
                if (!line.trim()) {
                    return
                }
                if (!line.startsWith('\t') && !line.startsWith(' ')) {
                    def parts = line.trim().split(/\s+/)
                    if (parts.length >= 2) {
                        fromClass = parts[0]
                        toClass = parts[1]
                        writer.writeLine("CL: ${fromClass} ${toClass}")
                    }
                    return
                }
                if (fromClass == null || toClass == null) {
                    return
                }
                def parts = line.trim().split(/\s+/)
                if (parts.length == 2) {
                    writer.writeLine("FD: ${fromClass}/${parts[0]} ${toClass}/${parts[1]}")
                } else if (parts.length >= 3) {
                    writer.writeLine("MD: ${fromClass}/${parts[0]} ${parts[1]} ${toClass}/${parts[2]} ${parts[1]}")
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'createMixinMcpToSrg'
    options.compilerArgs += [
            "-AoutRefMapFile=${buildDir}/generated/resources/mixin/mapsyncer.refmap.json",
            "-AreobfSrgFile=${buildDir}/createMcpToSrg/output.srg",
            "-AdefaultObfuscationEnv=searge"
    ]
}

tasks.named('processResources') {
    dependsOn 'compileJava'
}

// 创建仅包含项目内部依赖的配置
configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

// Shadow 插件配置：仅打包项目内部依赖
shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    // 排除 slf4j（运行时已由模块系统提供）
    exclude 'org/slf4j/**'
    // 排除 META-INF 中的签名文件
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// 重新配置 jar 任务依赖 shadowJar
tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

// 禁用 jarJar（使用 shadowJar 替代）
tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        register('forge12111MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
