plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-neoforge-1.21.11'
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge 21.1.x（MC 1.21.1 API，ResourceLocation 可用）
// TODO: 升级 21.11.0-beta → 三平台共享 fabric-shared
// NeoForge 21.11.x 使用 Identifier API
// 参考: https://neoforged.net/news/21.11release/

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    // NeoForge 21.11.x for Minecraft 1.21.11 (Identifier API)
    // NeoForge 21.1.x (Minecraft 1.21.1 API 兼容层)
    // TODO: 切换 21.11.0-beta (Maven 需网络访问)
    // NeoForge 21.11.x 使用 Identifier API → 可合并 fabric-shared
    version = "21.1.77"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemapping', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// 引用版本特定的共享源码（由平台模块提供 MC 依赖）
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
// libs/common — 全版本共享的纯 Java 代码（source-only，不独立编译）
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 创建仅包含项目内部依赖的配置
configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

// Shadow 插件配置：仅打包项目内部依赖
shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    // 排除 slf4j（运行时已由模块系统提供）
    exclude 'org/slf4j/**'
    // 排除 META-INF 中的签名文件
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// 重新配置 jar 任务依赖 shadowJar
tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

// 禁用 jarJar（使用 shadowJar 替代）
tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        if (!publications.findByName('mavenJava')) {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}