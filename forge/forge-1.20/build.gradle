plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = mod_version + '-forge-1.20'
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 需要 Java 17（toolchain 将自动下载）
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    mappings channel: 'official', version: minecraft_120_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

dependencies {
    // Minecraft Forge
    minecraft "net.minecraftforge:forge:${forge_120_version}"

    // 依赖核心模块
    implementation project(':core')
    implementation project(':platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('forge120MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}