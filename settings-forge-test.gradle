// settings-forge.gradle — 专用于构建 Forge 模块
// ForgeGradle 6.x 不支持 Gradle 9.x，需使用 Gradle 8.x 构建
//
// 使用方式：gradle-8.9\bin\gradle -c scripts\fastbuild\settings-forge.gradle build

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = mod_id

// ── 抽象库层 ──
include 'libs:core'
include 'libs:platform-api'
include 'libs:common'

// ── Forge 模块 ──
include 'mc-1.20.1:shared'
include 'mc-1.20.1:forge'

include 'mc-1.21.1:shared'
include 'mc-1.21.1:forge'

include 'mc-1.21.11:shared'
include 'mc-1.21.11:forge'
