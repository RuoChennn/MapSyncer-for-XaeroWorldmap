plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.7'
}

version = mod_version + '-fabric-26.2'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 26.2 需要 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDirs(
    '../shared/src/main/java',
    "${rootProject.projectDir}/libs/common/src/main/java",
    'src/main/java',
)
sourceSets.main.resources.srcDirs(
    '../shared/src/main/resources',
    "${rootProject.projectDir}/libs/common/src/main/resources",
    'src/main/resources',
)

dependencies {
    // Minecraft 26.2 is unobfuscated and uses the official names directly.
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"

    implementation "net.fabricmc.fabric-api:fabric-api:0.154.2+26.2"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    // include 会将依赖打包到 JAR 中
    include project(':libs:core')
    include project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifySafePaths', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mapsyncer.client.XaeroMapDataHandlerPathCheck'
    enableAssertions = true
}

test.failOnNoDiscoveredTests = false
check.dependsOn verifySafePaths

def resourceProperties = [
    version: version,
    minecraft_version: "26.2",
    loader_version: "0.19.3",
]

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties resourceProperties

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

publishing {
    publications {
        register('fabric262MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir("repo")
        }
    }
}
