plugins {
    id 'java-library'
}

group = mod_group_id
version = mod_version

// mc-26.2:shared 模块：MC 26.x 版本特定的 MC API 源码
// 此模块不独立编译，仅作为源码仓库
// 同版本的平台模块通过 sourceSet 引用此模块的源码，由平台模块提供 Minecraft 依赖

// 禁用所有编译任务
tasks.withType(JavaCompile).configureEach {
    enabled = false
}

// 禁用 jar 任务
tasks.named('jar').configure {
    enabled = false
}

// 禁用 classes 任务
tasks.named('classes').configure {
    enabled = false
}

// 只声明依赖关系（供 IDE 识别），不实际编译
dependencies {
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    implementation 'org.slf4j:slf4j-api:2.0.9'
}

// MC 26.x 需要 Java 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
