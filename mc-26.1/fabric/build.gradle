plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-fabric-' + g4_261_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 26.1 需要 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDirs(
    "${rootProject.projectDir}/libs/mc-26/src/main/java",
    "${rootProject.projectDir}/libs/common/src/main/java",
    'src/main/java',
)
sourceSets.main.resources.srcDirs(
    "${rootProject.projectDir}/libs/mc-26/src/main/resources",
    "${rootProject.projectDir}/libs/common/src/main/resources",
    'src/main/resources',
)

apply from: rootProject.file('gradle/fabric-lz4-shadow.gradle')
apply from: rootProject.file('gradle/fabric-modmenu-stub.gradle')

dependencies {
    // Minecraft and Fabric 26.1 (无混淆映射，MC 26.1 即官方映射)
    minecraft "com.mojang:minecraft:${minecraft_261_version}"
    implementation "net.fabricmc:fabric-loader:0.19.2"

    // Fabric API for 26.1 (includes networking-api-v1 transitively)
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_261_version}"

    // Cloth Config (for configuration)
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_261_version}"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    shadowBundle project(':libs:core')
    shadowBundle project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_range_fabric", g4_261_minecraft_range_fabric
    inputs.property "loader_version", "0.19.2"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_range_fabric": g4_261_minecraft_range_fabric,
                "loader_version": "0.19.2"
    }
}

publishing {
    publications {
        register('fabric26MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
