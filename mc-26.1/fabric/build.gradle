plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = mod_version + '-fabric-26.1'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 26.1 需要 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
    // Mod Menu (optional)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDirs(
    "${rootProject.projectDir}/libs/mc-26/src/main/java",
    "${rootProject.projectDir}/libs/common/src/main/java",
    'src/main/java',
)
sourceSets.main.resources.srcDirs(
    "${rootProject.projectDir}/libs/mc-26/src/main/resources",
    "${rootProject.projectDir}/libs/common/src/main/resources",
    'src/main/resources',
)

dependencies {
    // Minecraft and Fabric 26.1 (无混淆映射，MC 26.1 即官方映射)
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.19.2"

    // Fabric API for 26.1 (includes networking-api-v1 transitively)
    implementation "net.fabricmc.fabric-api:fabric-api:0.149.1+26.1.2"

    // Cloth Config (for configuration)
    implementation "me.shedaniel.cloth:cloth-config-fabric:26.1.154"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    // include 会将依赖打包到 JAR 中
    include project(':libs:core')
    include project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", "26.1"
    inputs.property "loader_version", "0.19.2"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "26.1",
                "loader_version": "0.19.2"
    }
}

publishing {
    publications {
        register('fabric26MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
