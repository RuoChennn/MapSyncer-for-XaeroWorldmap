plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-neoforge-' + g4_261_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NeoForge 26.1.x 子项目（NeoForge 26.1.0.x）
// 依赖 core 和 platform-api 模块

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    // NeoForge 26.1.x for Minecraft 26.1
    version = neo_261_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemapping', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// 引用版本特定的共享源码（由平台模块提供 MC 依赖）
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/mc-26/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/mc-26/src/main/resources"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
    // NeoForge 26.1 FML loader（ModDev 2.0.141 未正确解析此依赖到编译类路径）
    implementation 'net.neoforged.fancymodloader:loader:11.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range_forge", g4_261_minecraft_range_forge

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_range_forge": g4_261_minecraft_range_forge
    }
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

// 创建仅包含项目内部依赖的配置
configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    configureLz4ShadowExcludes(it)
}

// 重新配置 jar 任务依赖 shadowJar
tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

// 禁用 jarJar（使用 shadowJar 替代）
tasks.named('jarJar') {
    enabled = false
}
