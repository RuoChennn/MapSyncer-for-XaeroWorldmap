plugins {
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

// 根项目：聚合构建，不产生输出 JAR
// 所有构建由子项目完成

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 构建所有子项目
task buildAll {
    dependsOn project(':core').tasks.build
    dependsOn project(':platform-api').tasks.build
    dependsOn project(':neoforge-1.21').tasks.build
}