plugins {
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

// 根项目：聚合构建，不产生输出 JAR
// 所有构建由子项目完成

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 构建所有子项目（使用 afterEvaluate 确保子项目已配置）
afterEvaluate {
    task buildAll {
        dependsOn ':libs:core:build'
        dependsOn ':libs:platform-api:build'
        dependsOn ':mc-1.21.1:neoforge:build'
        dependsOn ':mc-1.21.11:neoforge:build'
        dependsOn ':mc-1.21.1:forge:build'
        dependsOn ':mc-1.21.1:fabric:build'
        dependsOn ':mc-1.20.1:forge:build'
        finalizedBy 'collectJars'
    }
}

// 将所有子项目的构建产物统一收集到根目录 output
tasks.register('collectJars', Copy) {
    description = '将所有子项目 JAR 收集到 output 目录'
    group = 'distribution'
    into layout.projectDirectory.dir('output')
    // 从每个子项目的 build/libs 目录收集 JAR（不依赖构建任务）
    subprojects { sub ->
        from(sub.layout.buildDirectory.dir('libs')) {
            include '*.jar'
        }
    }
    // 排除 libs 模块的 JAR（不需要分发）
    outputs.upToDateWhen { false }
}
