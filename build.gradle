plugins {
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

// 根项目：聚合构建，不产生输出 JAR
// 所有构建由子项目完成

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 构建所有子项目（使用 afterEvaluate 确保子项目已配置）
afterEvaluate {
    task buildAll {
        dependsOn ':core:build'
        dependsOn ':platform-api:build'
        dependsOn ':neoforge-1.21:build'
    }
}