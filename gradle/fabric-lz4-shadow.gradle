// Fabric：shadow 打包 core/platform-api（含已重定位 lz4），再交给 remapJar（Issue #13）
// 需在 dependencies 之前 apply；各模块声明 shadowBundle 依赖
apply from: rootProject.file('gradle/lz4-relocate.gradle')

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

tasks.named('jar', Jar) {
    archiveClassifier.set('dev')
}

tasks.named('shadowJar') {
    archiveClassifier.set('dev-all')
    configurations = [project.configurations.shadowBundle]
    configureLz4ShadowExcludes(it)
}

afterEvaluate {
    def remapJarTask = tasks.findByName('remapJar')
    if (remapJarTask != null) {
        // Loom remap（≤1.21.11）：shadowJar -> remapJar 产出发布 jar
        remapJarTask.dependsOn(tasks.named('shadowJar'))
        remapJarTask.inputFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })
    } else {
        // Loom 非 remap（≥26.1）：无 remapJar，shadowJar 即发布 jar
        tasks.named('jar', Jar) {
            enabled = false
        }
        tasks.named('shadowJar') {
            archiveClassifier.set('')
        }
        tasks.named('assemble').configure {
            dependsOn(tasks.named('shadowJar'))
        }
    }
}
