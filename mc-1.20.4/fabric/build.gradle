plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = mod_version + '-fabric-1.20.4'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 1.20.4 需要 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
    // Mod Menu (optional)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// 引用版本特定的共享源码（不独立编译，由本模块提供 MC 依赖）
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // Minecraft and Fabric
    minecraft "com.mojang:minecraft:1.20.4"
    // 使用 official mappings (Mojmap) 以保持与其他平台一致
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.4"

    // Cloth Config (for configuration)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:13.0.121"

    // 依赖核心模块
    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "1.20.4"
    inputs.property "loader_version", "0.15.11"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "1.20.4",
                "loader_version": "0.15.11"
    }
}

publishing {
    publications {
        register('fabric1204MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}