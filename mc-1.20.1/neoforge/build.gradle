plugins {
    id 'net.neoforged.gradle' version '6.0.21'
}

version = mod_version + '-neoforge-1.20.1'
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.20.1 需要 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'neoforge.logging.markers', 'REGISTRIES'
            property 'neoforge.logging.console.level', 'debug'
        }

        client {
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'neoforge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 直接将所有子模块源码合并编译，避免运行时 ClassNotFoundException
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/core/src/main/java"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/platform-api/src/main/java"

dependencies {
    // NeoForge 47.x for Minecraft 1.20.1
    minecraft "net.neoforged:neoforge:47.1.106"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('neoforge201MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}