plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version + '-forge-1.20.1'
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 需要 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// 直接将所有子模块源码合并编译，避免运行时 ClassNotFoundException
sourceSets.main.java.srcDir '../shared/src/main/java'
sourceSets.main.resources.srcDir '../shared/src/main/resources'
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/core/src/main/java"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/platform-api/src/main/java"
sourceSets.main.resources.srcDir "${buildDir}/generated/resources/mixin"

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_1201_version}-${forge_1201_version}"

    // Mixin annotation processor and compile-time dependency
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "org.spongepowered:mixin:0.8.5"

    // 强制 jopt-simple 版本
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.register('createMixinMcpToSrg') {
    dependsOn 'createMcpToSrg'
    def tsrgFile = file("${buildDir}/createMcpToSrg/output.tsrg")
    def srgFile = file("${buildDir}/createMcpToSrg/output.srg")
    inputs.file(tsrgFile)
    outputs.file(srgFile)
    doLast {
        String fromClass = null
        String toClass = null
        srgFile.parentFile.mkdirs()
        srgFile.withWriter('UTF-8') { writer ->
            tsrgFile.eachLine('UTF-8') { line ->
                if (!line.trim()) {
                    return
                }
                if (!line.startsWith('\t') && !line.startsWith(' ')) {
                    def parts = line.trim().split(/\s+/)
                    if (parts.length >= 2) {
                        fromClass = parts[0]
                        toClass = parts[1]
                        writer.writeLine("CL: ${fromClass} ${toClass}")
                    }
                    return
                }
                if (fromClass == null || toClass == null) {
                    return
                }
                def parts = line.trim().split(/\s+/)
                if (parts.length == 2) {
                    writer.writeLine("FD: ${fromClass}/${parts[0]} ${toClass}/${parts[1]}")
                } else if (parts.length >= 3) {
                    writer.writeLine("MD: ${fromClass}/${parts[0]} ${parts[1]} ${toClass}/${parts[2]} ${parts[1]}")
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'createMixinMcpToSrg'
    options.compilerArgs += [
            "-AoutRefMapFile=${buildDir}/generated/resources/mixin/mapsyncer.refmap.json",
            "-AreobfSrgFile=${buildDir}/createMcpToSrg/output.srg",
            "-AdefaultObfuscationEnv=searge"
    ]
}

tasks.named('processResources') {
    dependsOn 'compileJava'
}

publishing {
    publications {
        register('forge120MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
