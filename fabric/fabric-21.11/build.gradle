plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = mod_version + '-fabric-21.11'
group = mod_group_id

base {
    archivesName = mod_id
}

// Fabric 21.11 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // Minecraft and Fabric 1.21.11
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.0"

    // Fabric API for 1.21.11
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:16.0.0"

    implementation project(':core')
    implementation project(':platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "1.21.11"
    inputs.property "loader_version", "0.16.0"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "1.21.11",
                "loader_version": "0.16.0"
    }
}

publishing {
    publications {
        register('fabric2111MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}