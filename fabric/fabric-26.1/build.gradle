plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = mod_version + '-fabric-26.1'
group = mod_group_id

base {
    archivesName = mod_id + '-fabric-26.1'
}

// Fabric 26.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // Cloth Config
    maven { url = 'https://maven.shedaniel.me/' }
    // Mod Menu (optional)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // Minecraft and Fabric 26.1.x
    minecraft "com.mojang:minecraft:26.1.2"
    // 使用 official mappings (Mojmap) 以保持与其他平台一致
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.0"

    // Fabric API for 26.1
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.110.0+26.1"

    // Cloth Config (for configuration)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:16.0.0"

    // 依赖核心模块
    implementation project(':core')
    implementation project(':platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "26.1.2"
    inputs.property "loader_version", "0.16.0"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "26.1.2",
                "loader_version": "0.16.0"
    }
}

publishing {
    publications {
        register('fabric26MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}