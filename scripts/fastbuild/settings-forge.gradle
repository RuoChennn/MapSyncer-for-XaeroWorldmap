// settings-forge.gradle — Forge 胶水层专用（G1/G2/G3）
// MC API 源码在 libs/mc-1.20 | mc-1.21 | mc-1.21.11；本文件仅 include Forge 胶水模块。
// ForgeGradle 6.x 不支持 Gradle 9.x，需使用 Gradle 8.9 构建。
//
// 使用方式：gradle-8.9\bin\gradle -c scripts\fastbuild\settings-forge.gradle build

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'mapsyncer'

// ── 抽象库层 ──
include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-1.20'
include 'libs:mc-1.21'
include 'libs:mc-1.21.11'

// ── Forge 模块（仅 Forge 相关，不含 Fabric/NeoForge/Loom）──
include 'mc-1.20.1:forge'

include 'mc-1.21.1:forge'

include 'mc-1.21.11:forge'
