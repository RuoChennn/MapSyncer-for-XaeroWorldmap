// settings-12111.gradle — Fabric 1.21.11 胶水层专用（G3）
// MC API 源码在 libs/mc-1.21.11；隔离 Loom 1.15.4 与 Loom 1.9.2。
// 使用方式：gradlew.bat -c scripts/fastbuild/settings-12111.gradle build

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'mapsyncer'

// ── 抽象库层 ──
include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-1.21.11'

// ── Fabric 1.21.11 ──
include 'mc-1.21.11:fabric'
