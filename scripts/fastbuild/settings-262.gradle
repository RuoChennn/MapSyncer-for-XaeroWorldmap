// Isolated build for Minecraft 26.2 / Fabric Loom 1.17.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = mod_id

include 'libs:core'
include 'libs:platform-api'
include 'libs:common'
include 'mc-26.2:shared'
include 'mc-26.2:fabric'
