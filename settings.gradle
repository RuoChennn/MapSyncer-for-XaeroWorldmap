pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // NeoForge 插件仓库
        maven { url = 'https://maven.neoforged.net/releases' }
        // Forge 插件仓库
        maven { url = 'https://maven.minecraftforge.net/' }
        // Fabric 插件仓库
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = mod_id

// 核心模块（平台无关）
include 'core'              // 纯 Java 核心（MCA/NBT/工具类）
include 'platform-api'      // 平台抽象接口

// NeoForge 平台
include 'neoforge:neoforge-1.21'

// Forge 平台
include 'forge:forge-1.20'
// include 'forge:forge-1.21' // Forge 1.21 API 适配待完成（配置系统等）

// Fabric 平台（待专门适配 Fabric API 和 Yarn mappings）
// include 'fabric:fabric-1.20'
// include 'fabric:fabric-1.21'

// 预留版本
// include 'neoforge:neoforge-26'
// include 'fabric:fabric-26'