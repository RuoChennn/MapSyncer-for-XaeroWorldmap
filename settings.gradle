// settings-26.gradle — MC 26.x 胶水层专用（G4）
// MC API 源码在 libs/mc-26；隔离 Loom 1.16 与旧版 Loom。
//
// 使用方式：构建脚本临时切换此文件到 settings.gradle

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = mod_id

// ── 抽象库层 ──
include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-26'

// ── MC 26.x 胶水（协议 775 = 26.1，776 = 26.2；共用 libs/mc-26 源码）──
include 'mc-26.1:neoforge'
include 'mc-26.1:fabric'
include 'mc-26.2:neoforge'
include 'mc-26.2:fabric'
