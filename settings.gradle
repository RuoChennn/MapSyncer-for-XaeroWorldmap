pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // NeoForge 插件仓库
        maven { url = 'https://maven.neoforged.net/releases' }
        // Forge 插件仓库
        maven { url = 'https://maven.minecraftforge.net/' }
        // Fabric 插件仓库
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = mod_id

// 核心模块（平台无关）
include 'core'              // 纯 Java 核心（MCA/NBT/工具类）
include 'platform-api'      // 平台抽象接口

// NeoForge 平台
include 'neoforge:neoforge-1.20.1'
include 'neoforge:neoforge-1.20.4'
include 'neoforge:neoforge-1.21.1'
include 'neoforge:neoforge-21.11'
include 'neoforge:neoforge-26.1'

// Forge 平台
include 'forge:forge-1.20.1'
include 'forge:forge-1.20.4'
include 'forge:forge-1.21.1'
include 'forge:forge-21.11'
include 'forge:forge-26.1'

// Fabric 平台
include 'fabric:fabric-1.20.1'
include 'fabric:fabric-1.20.4'
include 'fabric:fabric-1.21.1'
include 'fabric:fabric-21.11'
include 'fabric:fabric-26.1'