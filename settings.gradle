pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // NeoForge 插件仓库
        maven { url = 'https://maven.neoforged.net/releases' }
        // Forge 插件仓库
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = mod_id

// 多项目结构（当前活跃的子项目）
include 'core'              // 纯 Java 核心（MCA/NBT/工具类）- 100% 复用
include 'platform-api'      // 平台抽象接口 - 100% 复用
include 'neoforge-1.21'     // NeoForge 1.21 实现（当前主项目）

// Forge 子项目（暂时禁用 - 需要安装 Java 17 或配置代理）
// include 'forge-1.20'        // Forge 1.20.1 实现
// include 'forge-1.21'        // Forge 1.21 实现

// 预留子项目（暂时禁用，待后续实现）
// include 'neoforge-26'       // NeoForge 26.x 实现