pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

rootProject.name = mod_id

// 多项目结构
include 'core'              // 纯 Java 核心（MCA/NBT/工具类）- 100% 复用
include 'platform-api'      // 平台抽象接口 - 100% 复用
include 'neoforge-1.21'     // NeoForge 1.21 实现（当前主项目）
include 'forge-1.20'        // Forge 1.20.1 实现（预留）
include 'neoforge-26'       // NeoForge 26.x 实现（预留）